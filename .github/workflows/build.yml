name: ShadowMask Build

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "native/**"
      - "build.py"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build ShadowMask artifacts
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Configure reproducible release signing
        if: github.event_name != 'pull_request'
        env:
          GH_PAT: ${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          SIGNING_DIR=".github/signing"
          KEYSTORE_B64="$SIGNING_DIR/keystore.jks.b64"
          SIGNING_ENV_FILE="$SIGNING_DIR/signing.env"

          if [ -f "$KEYSTORE_B64" ] && [ -f "$SIGNING_ENV_FILE" ]; then
            echo "Using committed keystore..."
            # shellcheck disable=SC1090
            source "$SIGNING_ENV_FILE"
          else
            echo "No keystore found — generating a new one and committing it..."
            STORE_PASSWORD="shadowmask-$(openssl rand -hex 12)"
            KEY_PASSWORD="shadowmask-$(openssl rand -hex 12)"
            KEY_ALIAS="shadowmask"

            keytool -genkeypair \
              -keystore shadowmask-release.jks \
              -storetype JKS \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=ShadowMask Build, OU=CI, O=ShadowMask, L=Unknown, ST=Unknown, C=US" \
              -noprompt

            mkdir -p "$SIGNING_DIR"
            openssl base64 -A -in shadowmask-release.jks > "$KEYSTORE_B64"
            printf 'STORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=%s\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > "$SIGNING_ENV_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
            git add "$KEYSTORE_B64" "$SIGNING_ENV_FILE"
            git commit -m "ci: add generated release keystore [skip ci]"
            git push origin HEAD:master
          fi

          # Decode keystore to working directory
          openssl base64 -d -A -in "$KEYSTORE_B64" > shadowmask-release.jks
          chmod 600 shadowmask-release.jks

          # Verify keystore integrity
          keytool -list -storetype JKS -keystore shadowmask-release.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          # Write config.prop for the build system
          cat > config.prop <<EOF
          keyStore=shadowmask-release.jks
          keyStorePass=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPass=$KEY_PASSWORD
          EOF

      - name: Build (native once + release & debug APKs)
        run: ./build.py -v fast

      - name: Stop Gradle daemon
        run: ./app/gradlew --stop

      - name: Rename APKs
        run: |
          mv out/app-debug.apk   out/shadowmask-debug.apk
          mv out/app-release.apk out/shadowmask-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: shadowmask-debug
          path: out/shadowmask-debug.apk
          compression-level: 9

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: shadowmask-release
          path: out/shadowmask-release.apk
          compression-level: 9

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest \
            --title "ShadowMask Build (latest)" \
            --notes "Automatically built from the master branch. Install shadowmask-release.apk to get the full ShadowMask app." \
            out/shadowmask-release.apk
