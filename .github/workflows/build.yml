name: Magisk Build

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "native/**"
      - "build.py"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build Magisk artifacts
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Build (native once + release & debug APKs)
        run: ./build.py -v fast

      - name: Stop Gradle daemon
        run: ./app/gradlew --stop

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}
          path: out
          compression-level: 9

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-symbols
          path: app/apk/build/outputs
          compression-level: 9
