name: ShadowMask Build

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "native/**"
      - "build.py"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build ShadowMask artifacts
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Build (native once + release & debug APKs)
        run: ./build.py -v fast

      - name: Stop Gradle daemon
        run: ./app/gradlew --stop

      - name: Rename APKs
        run: |
          mv out/app-debug.apk   out/shadowmask-debug.apk
          mv out/app-release.apk out/shadowmask-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: shadowmask-debug
          path: out/shadowmask-debug.apk
          compression-level: 9

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: shadowmask-release
          path: out/shadowmask-release.apk
          compression-level: 9

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest \
            --title "ShadowMask Build (latest)" \
            --notes "Automatically built from the master branch. Install shadowmask-release.apk to get the full ShadowMask app." \
            out/shadowmask-release.apk
