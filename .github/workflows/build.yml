name: ShadowMask Build

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "native/**"
      - "build.py"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build ShadowMask artifacts
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Configure reproducible release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADOWMASK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHADOWMASK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHADOWMASK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHADOWMASK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing SHADOWMASK_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing SHADOWMASK_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing SHADOWMASK_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing SHADOWMASK_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | openssl base64 -d -A > shadowmask-release.jks
          chmod 600 shadowmask-release.jks
          keytool -list -keystore shadowmask-release.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cat > config.prop <<EOF
          keyStore=shadowmask-release.jks
          keyStorePass=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPass=$KEY_PASSWORD
          EOF

      - name: Build (native once + release & debug APKs)
        run: ./build.py -v fast

      - name: Stop Gradle daemon
        run: ./app/gradlew --stop

      - name: Rename APKs
        run: |
          mv out/app-debug.apk   out/shadowmask-debug.apk
          mv out/app-release.apk out/shadowmask-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: shadowmask-debug
          path: out/shadowmask-debug.apk
          compression-level: 9

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: shadowmask-release
          path: out/shadowmask-release.apk
          compression-level: 9

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest \
            --title "ShadowMask Build (latest)" \
            --notes "Automatically built from the master branch. Install shadowmask-release.apk to get the full ShadowMask app." \
            out/shadowmask-release.apk
