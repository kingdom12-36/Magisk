name: Magisk Build

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "native/**"
      - "build.py"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build Magisk artifacts
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Build (native once + release & debug APKs)
        run: ./build.py -v fast

      - name: Stop Gradle daemon
        run: ./app/gradlew --stop

      - name: Rename APKs
        run: |
          mv out/app-debug.apk   out/magisk-debug.apk
          mv out/app-release.apk out/magisk-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: magisk-debug
          path: out/magisk-debug.apk
          compression-level: 9

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: magisk-release
          path: out/magisk-release.apk
          compression-level: 9
