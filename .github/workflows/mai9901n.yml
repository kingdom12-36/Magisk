name: Fast Java & Kotlin Validation

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle CLI
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Java & Kotlin Only
        working-directory: ./app
        run: gradle compileReleaseJavaWithJavac compileReleaseKotlin --continue
