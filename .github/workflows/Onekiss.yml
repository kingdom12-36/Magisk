name: Fast Project Validation (Res, Java, C, Themes)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # ==========================================
  # 1. فحص الموارد (XML Resources) والـ Themes
  # ==========================================
  check-resources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate XML Resources, Duplicates & Themes Consistency
        run: |
          python3 -c '
          import os, sys, re, xml.etree.ElementTree as ET
          from collections import defaultdict

          has_errors = False
          defined_styles = set()
          
          # استثناء ستايلات النظام ومكتبات Material Design الخارجية بالكامل
          framework_style_prefixes = (
              "Theme_DeviceDefault", 
              "Widget_DeviceDefault", 
              "Animation_", 
              "android_", 
              "MaterialAlertDialog", 
              "Widget_Design", 
              "Base_", 
              "Platform_"
          )

          # Phase 1: Parse all XML resource files deeply
          for root, dirs, files in os.walk("."):
              normalized_root = root.replace("\\", "/")
              if "/res" in normalized_root:
                  for file in files:
                      if file.endswith(".xml"):
                          file_path = os.path.join(root, file)
                          try:
                              tree = ET.parse(file_path)
                              
                              # Collect all style definitions recursively across the XML tree
                              for elem in tree.iter():
                                  tag_name = elem.tag.split("}")[-1]
                                  res_name = elem.attrib.get("name")
                                  
                                  if tag_name == "style" and res_name:
                                      defined_styles.add(res_name)

                              # Check for duplicates if inside values directory
                              if "/values" in normalized_root:
                                  resources = defaultdict(list)
                                  for elem in tree.iter():
                                      tag_name = elem.tag.split("}")[-1]
                                      res_name = elem.attrib.get("name")
                                      if res_name and tag_name in ["string", "color", "style", "array", "dimen", "integer"]:
                                          resources[(tag_name, res_name)].append(file_path)

                                  for (res_type, res_name), file_list in resources.items():
                                      if len(file_list) > 1:
                                          files_formatted = ", ".join(file_list)
                                          print(f"::error::Duplicate <{res_type} name=\"{res_name}\"> found in: {files_formatted}")
                                          has_errors = True

                          except Exception as e:
                              print(f"::error file={file_path}::XML Syntax Error: {e}")
                              has_errors = True

          # Phase 2: Validate Custom Themes defined in Kotlin/Java files
          referenced_themes = set()
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".kt") or file.endswith(".java"):
                      kt_path = os.path.join(root, file)
                      try:
                          with open(kt_path, "r", encoding="utf-8") as f:
                              content = f.read()
                              found_styles = re.findall(r"R\.style\.([A-Za-z0-9_]+)", content)
                              for style_name in found_styles:
                                  if any(style_name.startswith(p) for p in framework_style_prefixes):
                                      continue
                                  referenced_themes.add((style_name, kt_path))
                      except Exception:
                          pass

          # Check if referenced custom themes actually exist in XML styles
          for style_name, kt_file in referenced_themes:
              if style_name not in defined_styles:
                  print(f"::error file={kt_file}::Theme style \x27R.style.{style_name}\x27 is referenced in code but missing in XML values definition!")
                  has_errors = True

          if has_errors:
              print("\n❌ Resource & Theme validation failed!")
              sys.exit(1)
          else:
              print("✅ All resource XML files, duplicates, and Theme mappings validated successfully!")
          '

  # ==========================================
  # 2. فحص كود Java و Kotlin والاستيرادات
  # ==========================================
  check-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check for leftover Magisk package references
        run: |
          echo "Scanning for old Magisk packages and imports..."
          FOUND=0
          
          while IFS=: read -r file line content; do
            if [ -n "$file" ]; then
              FOUND=1
              echo "🔗 https://github.com/${{ github.repository }}/blob/${{ github.sha }}/$file#L$line"
              echo "::error file=$file,line=$line::Found old Magisk reference: $content"
            fi
          done < <(grep -rn --include=\*.{kt,java,aidl} "com\.topjohnwu\.magisk" app/)

          if [ $FOUND -eq 1 ]; then
            echo "❌ Please update the references above to com.shadowmask."
            exit 1
          else
            echo "✅ All imports and packages are clean!"
          fi

      - name: Compile App (Java/Kotlin) via build.py
        run: python3 build.py app

  # ==========================================
  # 3. فحص C/C++
  # ==========================================
  check-c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Check C/C++ Syntax and Logic
        run: |
          cppcheck --enable=warning,performance,portability \
                   --error-exitcode=1 \
                   --inline-suppr \
                   -i native/src/external/ \
                   --suppress=missingInclude \
                   --suppress=missingIncludeSystem \
                   --suppress=unknownMacro \
                   --suppress=cstyleCast \
                   --suppress=variableScope \
                   --suppress=constParameterPointer \
                   --suppress=invalidscanf \
                   --suppress=uninitvar \
                   --suppress=uninitDerivedMemberVar \
                   --suppress=invalidPrintfArgType_uint \
                   native/
