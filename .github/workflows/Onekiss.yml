name: Fast Project Validation & Complete Magisk Audit

# Runs on every push/PR as a comprehensive gate.
# Performs static analysis, Zygisk verification, and exhaustive string classification.

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: fast-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprehensive-magisk-audit:
    name: Complete Magisk Residue & Zygisk Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Exhaustive Codebase Audit & Generate Summary
        run: |
          python3 - <<'EOF'
          import os, re, sys

          scan_dirs = ['app', 'native', 'scripts', '.github']
          skip_dirs = {'build', '.gradle', '.git', 'target', '.idea', 'external'}
          code_extensions = {'.kt', '.java', '.aidl', '.xml', '.rs', '.cpp', '.c', '.cc', '.h', '.sh', '.yml', '.yaml', '.md', '.txt', '.mk'}

          critical_fixes = []
          zygisk_bootstrap = []
          safe_docs = []

          # Components that require verification or specific handling
          BOOTSTRAP_TOOLS = {"magiskinit", "magiskboot", "magiskd"}
          DEPRECATED_CRITICAL = {"com.topjohnwu.magisk", "u:r:magisk:s0", "magisk32", "magisk64", "magiskpolicy"}

          for d in scan_dirs:
              if not os.path.exists(d):
                  continue
              for root, dirs, files in os.walk(d):
                  dirs[:] = [dir_name for dir_name in dirs if dir_name not in skip_dirs]
                  for fname in files:
                      fpath = os.path.join(root, fname)
                      ext = os.path.splitext(fname)[1].lower()
                      if ext not in code_extensions and fname != "Makefile" and not fname.endswith(".gradle"):
                          continue
                      try:
                          with open(fpath, encoding='utf-8', errors='replace') as f:
                              lines = f.readlines()
                      except Exception:
                          continue

                      for lineno, line in enumerate(lines, 1):
                          if not re.search(r'magisk', line, re.IGNORECASE):
                              continue

                          rel = os.path.relpath(fpath)
                          repo = os.environ.get('GITHUB_REPOSITORY', '')
                          sha  = os.environ.get('GITHUB_SHA', 'HEAD')
                          link = f"https://github.com/{repo}/blob/{sha}/{rel}#L{lineno}"
                          snippet = line.strip()
                          lower_line = line.lower()

                          # Classification Rule Set
                          if ext in {'.md', '.txt'} or 'http://' in lower_line or 'https://' in lower_line or 'copyright' in lower_line or 'credits' in lower_line:
                              safe_docs.append((rel, lineno, snippet, link, "Documentation / URL / License reference"))
                          elif any(dc in lower_line for dc in DEPRECATED_CRITICAL) or '"/magisk"' in lower_line or re.search(r'\b\.\/magisk\b', lower_line):
                              critical_fixes.append((rel, lineno, snippet, link, "Hardcoded binary, package, or SELinux domain"))
                          elif any(bt in lower_line for bt in BOOTSTRAP_TOOLS) or 'zygisk' in lower_line:
                              zygisk_bootstrap.append((rel, lineno, snippet, link, "Zygisk / Bootstrap component (verify compatibility)"))
                          else:
                              # Code-layer fallback
                              if ext in {'.kt', '.java', '.cpp', '.rs', '.h', '.c', '.sh'}:
                                  critical_fixes.append((rel, lineno, snippet, link, "Source code reference requiring manual review"))
                              else:
                                  safe_docs.append((rel, lineno, snippet, link, "Non-critical configuration text"))

          # Build GitHub Step Summary Report
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          report = []
          report.append("# 🔍 ShadowMask Codebase Magisk Audit Report\n")
          report.append(f"### Summary Statistics\n")
          report.append(f"* **🔴 Critical Functional Items:** `{len(critical_fixes)}`\n")
          report.append(f"* **🟡 Zygisk & Bootstrap Items:** `{len(zygisk_bootstrap)}`\n")
          report.append(f"* **🟢 Safe / Documentation Items:** `{len(safe_docs)}`\n\n")

          report.append("## 🔴 Critical Items Requiring Code Changes\n")
          if critical_fixes:
              report.append("| File | Line | Reason | Code Snippet | Link |\n")
              report.append("|---|---|---|---|---|\n")
              for rel, lineno, snippet, link, reason in critical_fixes:
                  safe_snip = snippet.replace('|', '\\|').replace('`', '\\`')
                  report.append(f"| `{rel}` | {lineno} | {reason} | `{safe_snip}` | [View]({link}) |\n")
          else:
              report.append("✅ No critical code issues detected!\n")

          report.append("\n## 🟡 Zygisk & Bootstrap Review Items (Compatibility Check)\n")
          if zygisk_bootstrap:
              report.append("| File | Line | Reason | Code Snippet | Link |\n")
              report.append("|---|---|---|---|---|\n")
              for rel, lineno, snippet, link, reason in zygisk_bootstrap:
                  safe_snip = snippet.replace('|', '\\|').replace('`', '\\`')
                  report.append(f"| `{rel}` | {lineno} | {reason} | `{safe_snip}` | [View]({link}) |\n")

          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write("".join(report))

          print(f"Audit completed: {len(critical_fixes)} critical, {len(zygisk_bootstrap)} review items.")
          
          # Enforce failure only on critical functional bugs
          if critical_fixes:
              print("❌ Critical legacy Magisk references found in functional layers.")
              sys.exit(1)
          else:
              print("✅ Audit passed successfully.")
          EOF

  # ══════════════════════════════════════════════════════════════════
  # 2. XML RESOURCES & THEMES
  # ══════════════════════════════════════════════════════════════════
  check-resources:
    name: XML resources & theme consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate XML, duplicates & theme references
        run: |
          python3 - <<'EOF'
          import os, sys, re, xml.etree.ElementTree as ET
          from collections import defaultdict

          has_errors = False
          defined_styles = set()
          FRAMEWORK_PREFIXES = (
              "Theme_DeviceDefault", "Widget_DeviceDefault", "Animation_",
              "android_", "MaterialAlertDialog", "Widget_Design",
              "Base_", "Platform_", "ThemeFoundationMD2_", "Foundation_",
          )
          SKIP_DIRS = {"build", ".gradle", ".git"}

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
              norm = root.replace("\\", "/")
              if "/res" not in norm:
                  continue
              for fname in files:
                  if not fname.endswith(".xml"):
                      continue
                  fpath = os.path.join(root, fname)
                  try:
                      tree = ET.parse(fpath)
                  except Exception as e:
                      print(f"::error file={fpath}::XML syntax error: {e}")
                      has_errors = True
                      continue

                  for elem in tree.iter():
                      tag = elem.tag.split("}")[-1]
                      name = elem.attrib.get("name")
                      if tag == "style" and name:
                          defined_styles.add(name)

                  if "/values" in norm:
                      resources = defaultdict(list)
                      for elem in tree.iter():
                          tag  = elem.tag.split("}")[-1]
                          name = elem.attrib.get("name")
                          if name and tag in {"string", "color", "style", "array", "dimen", "integer"}:
                              resources[(tag, name)].append(fpath)
                      for (rtype, rname), paths in resources.items():
                          if len(paths) > 1:
                              print(f"::error::Duplicate <{rtype} name=\"{rname}\"> in: {', '.join(paths)}")
                              has_errors = True

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
              for fname in files:
                  if not (fname.endswith(".kt") or fname.endswith(".java")):
                      continue
                  fpath = os.path.join(root, fname)
                  try:
                      content = open(fpath, encoding="utf-8", errors="replace").read()
                  except Exception:
                      continue
                  for style_name in re.findall(r"R\.style\.([A-Za-z0-9_]+)", content):
                      if any(style_name.startswith(p) for p in FRAMEWORK_PREFIXES):
                          continue
                      if style_name not in defined_styles:
                          print(f"::error file={fpath}::R.style.{style_name} referenced but missing in XML values")
                          has_errors = True

          if has_errors:
              print("\n❌ Resource / theme validation failed.")
              sys.exit(1)
          else:
              print("✅ XML resources, duplicates, and theme references all valid.")
          EOF

  # ══════════════════════════════════════════════════════════════════
  # 3. C / C++ STATIC ANALYSIS (CPPCHECK)
  # ══════════════════════════════════════════════════════════════════
  check-c:
    name: C/C++ static analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            -i native/src/external/ \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=unknownMacro \
            --suppress=cstyleCast \
            --suppress=variableScope \
            --suppress=constParameterPointer \
            --suppress=invalidscanf \
            --suppress=uninitvar \
            --suppress=uninitDerivedMemberVar \
            --suppress=invalidPrintfArgType_uint \
            native/ 2>&1 | tee /tmp/cppcheck.txt

          python3 - <<'EOF'
          import re, os
          with open("/tmp/cppcheck.txt") as f:
              for line in f:
                  m = re.match(r'^(.+?):(\d+):(\d+):\s*(error|warning|performance|portability):\s*(.+)', line)
                  if m:
                      fpath, lineno, _, severity, msg = m.groups()
                      level = "error" if severity == "error" else "warning"
                      print(f"::{level} file={fpath},line={lineno}::{msg.strip()}")
          EOF
