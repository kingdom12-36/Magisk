name: ShadowMask Modular Build

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "native/**"
      - "build.py"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. بناء ملفات الـ Native (C/C++) لكل المعماريات
  # ==========================================
  build-native:
    name: Build Native Binaries (NDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: "recursive"

      - uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Compile Native C/C++ Binaries
        run: ./build.py native

      - name: Verify Output Directory
        run: |
          echo "Checking contents of native/out/ directory:"
          ls -R native/out/

      - name: Upload Native Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: native/out/
          retention-days: 1
          if-no-files-found: error

  # ==========================================
  # 2. بناء نسخة الـ Debug
  # ==========================================
  build-debug-apk:
    name: Build Debug APK
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Download Native Binaries
        uses: actions/download-artifact@v4
        with:
          name: native-binaries
          path: native/out/

      - name: Build Debug APK
        run: ./build.py app

      - name: Rename Debug APK
        run: mv out/app-debug.apk out/shadowmask-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shadowmask-debug
          path: out/shadowmask-debug.apk

  # ==========================================
  # 3. بناء نسخة الـ Release والمفاتيح والـ Release التلقائي
  # ==========================================
  build-release-apk:
    name: Build Signed Release APK & Publish
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Download Native Binaries
        uses: actions/download-artifact@v4
        with:
          name: native-binaries
          path: native/out/

      - name: Configure Keystore & Signing
        if: github.event_name != 'pull_request'
        env:
          GH_PAT: ${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          SIGNING_DIR=".github/signing"
          KEYSTORE_B64="$SIGNING_DIR/keystore.jks.b64"
          SIGNING_ENV_FILE="$SIGNING_DIR/signing.env"

          if [ -f "$KEYSTORE_B64" ] && [ -f "$SIGNING_ENV_FILE" ]; then
            source "$SIGNING_ENV_FILE"
          else
            STORE_PASSWORD="shadowmask-$(openssl rand -hex 12)"
            KEY_PASSWORD="shadowmask-$(openssl rand -hex 12)"
            KEY_ALIAS="shadowmask"

            keytool -genkeypair \
              -keystore shadowmask-release.jks \
              -storetype JKS \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=ShadowMask Build, OU=CI, O=ShadowMask, L=Unknown, ST=Unknown, C=US" \
              -noprompt

            mkdir -p "$SIGNING_DIR"
            openssl base64 -A -in shadowmask-release.jks > "$KEYSTORE_B64"
            printf 'STORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=%s\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > "$SIGNING_ENV_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
            git add "$KEYSTORE_B64" "$SIGNING_ENV_FILE"
            git commit -m "ci: add generated release keystore [skip ci]"
            git push origin HEAD:master
          fi

          openssl base64 -d -A -in "$KEYSTORE_B64" > shadowmask-release.jks
          chmod 600 shadowmask-release.jks

          cat > config.prop <<EOF
          keyStore=shadowmask-release.jks
          keyStorePass=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPass=$KEY_PASSWORD
          EOF

      - name: Build Release APK
        run: ./build.py app

      - name: Rename Release APK
        run: mv out/app-release.apk out/shadowmask-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: shadowmask-release
          path: out/shadowmask-release.apk

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest \
            --title "ShadowMask Build (latest)" \
            --notes "Automatically built using modular runner strategy." \
            out/shadowmask-release.apk
