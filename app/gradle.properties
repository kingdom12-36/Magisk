# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# JVM heap: 4 GB gives Kotlin/kapt enough headroom to avoid GC pressure.
# G1GC has lower worst-case pause times than the default GC for large heaps.
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -Dfile.encoding=UTF-8

# Parallel sub-project execution (already decoupled)
org.gradle.parallel=true

# Build cache: reuse task outputs across invocations
org.gradle.caching=true

# Keep the daemon alive for the full build session
org.gradle.daemon.idletimeout=3600000

# Use K2 in kapt
kapt.use.k2=true

# Android
android.injected.testOnly=false

# ShadowMask
shadowmask.stubVersion=40
shadowmask.versionCode=30700
